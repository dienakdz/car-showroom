services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: car_app
    user: "0:0"
    working_dir: /var/www/html
    command: >
      sh -lc "mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing bootstrap/cache && chown -R www:www storage/framework bootstrap/cache && chmod -R ug+rwX storage/framework bootstrap/cache && if [ ! -f vendor/autoload.php ] || [ composer.lock -nt vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi && if [ -f .env ]; then php artisan config:cache --ansi; fi && php-fpm"
    volumes:
      - ./apps/laravel:/var/www/html
      - vendor_data:/var/www/html/vendor
      - framework_data:/var/www/html/storage/framework
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: car_nginx
    ports:
      - "8889:80"
    volumes:
      - ./apps/laravel/public:/var/www/html/public:ro
      - ./apps/laravel/storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  car-search:
    build:
      context: ./apps/car-search
    container_name: car_search
    environment:
      CAR_SEARCH_API_TOKEN: ${CAR_SEARCH_API_TOKEN:-local-car-search-token}
      SEARCH_DB_HOST: mysql
      SEARCH_DB_PORT: 3306
      SEARCH_DB_DATABASE: ${DB_DATABASE:-car_showroom}
      SEARCH_DB_USERNAME: ${DB_USERNAME:-car}
      SEARCH_DB_PASSWORD: ${DB_PASSWORD:-car}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: car_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: car_showroom
      MYSQL_USER: car
      MYSQL_PASSWORD: car
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  vendor_data:
  framework_data:
  bootstrap_cache_data:
