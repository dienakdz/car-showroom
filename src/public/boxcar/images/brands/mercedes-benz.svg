<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mbChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
  </defs>
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#mbChrome)" stroke-width="5"/>
  <!-- Three Pointed Star -->
  <g fill="url(#mbChrome)">
    <!-- Top Ray -->
    <polygon points="50,7 48,50 50,45 52,50"/>
    <polygon points="50,7 50,45 52,50" fill="#09090B"/>
    <!-- Bottom Right Ray -->
    <polygon points="87,71 48,50 52,47 54,53"/>
    <polygon points="87,71 52,47 54,53" fill="#09090B"/>
    <!-- Bottom Left Ray -->
    <polygon points="13,71 47,53 48,47 52,50"/>
    <polygon points="13,71 48,47 47,53" fill="#09090B"/>
  </g>
</svg>
