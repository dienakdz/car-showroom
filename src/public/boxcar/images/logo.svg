<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 34" width="205" height="34" fill="none">
    <defs>
        <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F3E2B8"/>
            <stop offset="45%" stop-color="#D4AF37"/>
            <stop offset="100%" stop-color="#A67C1E"/>
        </linearGradient>
        <linearGradient id="silverGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="50%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#94A3B8"/>
        </linearGradient>
    </defs>

    <!-- Supercar Silhouette & Monogram MD Emblem (Left) -->
    <g transform="translate(1, 1)">
        <!-- Aerodynamic Roofline & Spoiler -->
        <path d="M 4 23.5 C 6.5 14.5 13.5 7 24 5 C 31 4 38 6.5 45 11 L 49.5 12 C 51.5 10 54 11 52.5 14 C 50.5 13.2 48.5 13 46 13.5 C 39.5 10 32 8.2 24.5 8.8 C 15.5 10.2 9 16 6.5 22.8 Z" fill="url(#goldGradDark)"/>
        
        <!-- Hood & Windshield Accent Line -->
        <path d="M 12 18 C 17.5 11 25 8.8 32.5 9.5 C 34.5 9.8 35.5 10.8 34 11.5 C 27 10.8 19.5 12.5 14 18.8 Z" fill="url(#silverGradDark)"/>

        <!-- Stylized Letter 'M' (Front Arch) -->
        <path d="M 4.5 26.5 L 12.8 8.5 L 18.5 19.2 L 24.2 8.5 L 32.5 26.5 H 26.8 L 23.5 17.5 L 18.5 25.2 L 13.5 17.5 L 10.2 26.5 Z" fill="url(#goldGradDark)"/>

        <!-- Stylized Letter 'D' (Rear Body & Arch) -->
        <path d="M 28.5 26.5 L 36.5 8.5 H 45.5 C 51.5 8.5 55.5 12.2 55 17.5 C 54.5 22.8 49.8 26.5 43.5 26.5 Z M 36.5 22 H 42 C 45.8 22 49 20.2 49.2 17.5 C 49.5 14.5 46.8 13 43 13 H 38.2 Z" fill="url(#silverGradDark)"/>
        
        <!-- Speed underline -->
        <path d="M 6 29 Q 28 31 52 28" stroke="url(#goldGradDark)" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Brand Typography 'MD-CARS' (Right) -->
    <g transform="translate(60, 0)">
        <text x="0" y="21.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="1.2" fill="#FFFFFF">MD</text>
        <!-- Gold Hyphen Accent -->
        <rect x="35" y="13.5" width="7" height="3.5" rx="1.75" fill="url(#goldGradDark)"/>
        <text x="45" y="21.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" fill="#FFFFFF">CARS</text>
        
        <!-- Subtitle -->
        <text x="0.5" y="30.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5.2" letter-spacing="2.4" fill="#D4AF37">PREMIUM SHOWROOM</text>
    </g>
</svg>
